apiVersion: v1
kind: Service
metadata:
  name: nginx-np 
spec:
  type: NodePort # otherwise it will be considered as cluster Ip
  selector: 
    project: roboshop
    component: frontend
    environemnt: dev
    purpose: node-port
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port